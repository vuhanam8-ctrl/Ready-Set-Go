<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ready Set Go</title>
  <style>
    :root { color-scheme: light; background: #f5f5ef; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; overflow: hidden; }
    .stages { position: relative; width: min(88vw, 1000px); height: min(78svh, 660px); isolation: isolate; }
    .stage { position: absolute; overflow: hidden; border: 1px solid #dbdfd4; border-radius: 18px; box-shadow: 0 16px 45px #343b380d; }
    .stage-main { left: 5%; top: 6%; width: 60%; height: 84%; background: #edf0e7; z-index: 1; }
    .stage-second { right: 3%; top: 0; width: 45%; height: 56%; background: #edeae4; z-index: 0; }
    .stage-third { right: 0; bottom: 0; width: 46%; height: 55%; background: #e8ecec; z-index: 2; }
    .model-mount { position: absolute; inset: 0; }
    .model-mount canvas { display: block; width: 100%; height: 100%; }
    @media (max-width: 650px) { .stages { width: 94vw; height: 72svh; } .stage-main { left: 0; width: 70%; } .stage-second { right: 0; width: 52%; height: 48%; } .stage-third { width: 58%; height: 48%; } }
  </style>
</head>
<body>
  <main aria-label="Character stage">
    <div class="stages">
      <div class="stage stage-main"><div class="model-mount" id="model-main"></div></div>
      <div class="stage stage-second"><div class="model-mount" id="model-second"></div></div>
      <div class="stage stage-third"><div class="model-mount" id="model-third"></div></div>
    </div>
  </main>
</body>
</html>
