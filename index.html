<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ready Set Go</title>
  <style>
    :root { color-scheme: dark; background: #e71932; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { min-height: 100vh; min-height: 100svh; overflow: hidden; }
    #model-frame { position: relative; width: 50vw; height: 100svh; overflow: hidden; background: transparent; }
    #model-main { position: absolute; left: 50%; top: 50%; width: 110svh; height: 110svh; background: transparent; transform: translate(-50%, -50%); transform-origin: center; }
    #model-main canvas { display: block; width: 100%; height: 100%; background: transparent; transform: rotate(130deg); transform-origin: center; }
  </style>
</head>
<body>
  <main aria-label="Character stage">
    <div id="model-frame"><div id="model-main"></div></div>
  </main>
  <script src="./runtime/live2dcubismcore.min.js"></script>
  <script type="module" src="./live2d.js"></script>
</body>
</html>
