<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ready Set Go</title>
  <style>
    :root { color-scheme: dark; background: #e71932; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; }
    #model-main { position: relative; width: min(90vw, 1100px); height: 88svh; background: transparent; }
    #model-main canvas { display: block; width: 100%; height: 100%; background: transparent; }
  </style>
</head>
<body>
  <main aria-label="Character stage">
    <div id="model-main"></div>
  </main>
  <script type="module" src="./live2d.js"></script>
</body>
</html>
