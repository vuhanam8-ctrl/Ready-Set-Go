<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ready Set Go</title>
  <style>
    :root { color-scheme: dark; background: #e71932; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; overflow: hidden; }
    .stages { position: relative; width: min(94vw, 1400px); height: 88svh; isolation: isolate; }
    .stage { position: absolute; background: #f5f2e9; padding: 7px; filter: drop-shadow(12px 14px 0 #650915); }
    .model-mount { position: absolute; inset: 7px; background: #141414; }
    .stage-main { left: 2%; top: 9%; width: 62%; height: 82%; z-index: 1; transform: rotate(-7deg); clip-path: polygon(0 5%, 96% 0, 100% 93%, 5% 100%); }
    .stage-main .model-mount { clip-path: polygon(0 5%, 96% 0, 100% 93%, 5% 100%); }
    .stage-second { right: 1%; top: 2%; width: 48%; height: 53%; z-index: 0; transform: rotate(7deg); clip-path: polygon(5% 0, 100% 8%, 94% 100%, 0 91%); }
    .stage-second .model-mount { background: #272727; clip-path: polygon(5% 0, 100% 8%, 94% 100%, 0 91%); }
    .stage-third { right: 0; bottom: 1%; width: 49%; height: 49%; z-index: 2; transform: rotate(-5deg); clip-path: polygon(0 9%, 95% 0, 100% 91%, 6% 100%); }
    .stage-third .model-mount { background: #393939; clip-path: polygon(0 9%, 95% 0, 100% 91%, 6% 100%); }
    .model-mount canvas { display: block; width: 100%; height: 100%; }
    @media (max-width: 650px) {
      .stages { width: 90vw; height: 83svh; }
      .stage-main { left: 0; top: 17%; width: 78%; height: 67%; }
      .stage-second { right: 0; top: 3%; width: 68%; height: 42%; }
      .stage-third { right: -2%; bottom: 0; width: 72%; height: 39%; }
    }
  </style>
</head>
<body>
  <main aria-label="Character stage">
    <div class="stages">
      <div class="stage stage-main"><div class="model-mount" id="model-main"></div></div>
      <div class="stage stage-second"><div class="model-mount" id="model-second"></div></div>
      <div class="stage stage-third"><div class="model-mount" id="model-third"></div></div>
    </div>
  </main>
</body>
</html>
